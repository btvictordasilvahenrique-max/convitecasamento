<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite Especial</title>
  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background: #fdfdfd;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 900px;
      height: 100vh;
      overflow: hidden;
    }

    /* Convite (fundo) */
    .convite {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url(CONVTE01.png) no-repeat center/cover;
      z-index: 1;
    }

    /* Capa (primeira camada visível) */
    .capa {
      position: absolute;
      width: 100%;
      height: 100%;
      background: url('capa 01.jpeg') no-repeat center/cover;
      z-index: 2;
      transition: opacity 1.5s ease, transform 1.5s ease;
      cursor: pointer;
    }

    /* Estado oculto da capa */
    .capa.oculto {
      opacity: 0;
      transform: scale(1.05); /* leve zoom-out */
      pointer-events: none;
    }

    /* Link invisível sobre "Lista de presentes" */
    .link-presentes {
      position: absolute;
      bottom: 200px; /* SUBI a posição vertical */
      left: 50%;
      transform: translateX(-50%);
      width: 220px;   /* largura aproximada do texto */
      height: 35px;   /* altura aproximada do texto */
      cursor: pointer;
      text-decoration: none;
      color: transparent; /* invisível */
      background: transparent;
      z-index: 3; /* acima do convite */
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Convite -->
    <div class="convite"></div>

    <!-- Link invisível sobre "Lista de presentes" -->
    <a href="https://noivos.casar.com/victorecamilly#/one-page/_start" target="_blank" class="link-presentes">
      Lista de presentes
    </a>

    <!-- Capa -->
    <div class="capa"></div>
  </div>

  <script>
    const capa = document.querySelector('.capa');
    capa.addEventListener('click', () => {
      capa.classList.add('oculto');
    });
  </script>
</body>
</html>
